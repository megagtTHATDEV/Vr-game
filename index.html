<!DOCTYPE html>
<html>
<head>
  <title>VR Grab Game</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true">

    <!-- Camera -->
    <a-entity camera position="0 1.6 0"></a-entity>

    <!-- Ground -->
    <a-plane rotation="-90 0 0" width="20" height="20" color="#4CAF50"></a-plane>

    <!-- Sky -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Cube you can "hit" -->
    <a-box position="0 1 -3" color="red" id="box"></a-box>

    <!-- Left Hand -->
    <a-entity hand-controls="hand: left"></a-entity>

    <!-- Right Hand -->
    <a-entity hand-controls="hand: right"></a-entity>

  </a-scene>

  <script>
    const box = document.querySelector("#box");

    // Make it react when you click/trigger it
    box.addEventListener("click", () => {
      box.setAttribute("color", "#" + Math.floor(Math.random()*16777215).toString(16));
      box.setAttribute("position", {
        x: (Math.random() - 0.5) * 4,
        y: 1 + Math.random() * 2,
        z: -2 - Math.random() * 4
      });
    });
  </script>
</body>
</html>
